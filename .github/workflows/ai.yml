name: ai
on:
  workflow_dispatch:
concurrency:
  group: ai
  cancel-in-progress: false
permissions:
  actions: write
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install huggingface_hub
      - name: Restore model cache
        id: mc
        uses: actions/cache/restore@v4
        with:
          path: models
          key: model-${{ vars.MODEL_REPO || 'bartowski/Qwen2.5-7B-Instruct-GGUF' }}-${{ vars.MODEL_PATTERN || 'Q4_K_M' }}
      - name: Download model
        if: steps.mc.outputs.cache-hit != 'true'
        run: python3 get_model.py
        env:
          MODEL_REPO: ${{ vars.MODEL_REPO || 'bartowski/Qwen2.5-7B-Instruct-GGUF' }}
          MODEL_PATTERN: ${{ vars.MODEL_PATTERN || 'Q4_K_M' }}
      - name: Save model cache (right after download, so it survives cancels)
        if: steps.mc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: models
          key: model-${{ vars.MODEL_REPO || 'bartowski/Qwen2.5-7B-Instruct-GGUF' }}-${{ vars.MODEL_PATTERN || 'Q4_K_M' }}
      - name: Start llama.cpp server
        run: bash start_llm.sh
      - name: Install cloudflared (panel tunnel)
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo install -m 755 cloudflared /usr/local/bin/cloudflared
      - name: Run bot
        run: node bot.js
        env:
          PANEL_TOKEN: ${{ secrets.PANEL_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PANEL_TUNNEL: "1"
          ONCE: "1"
          SESSION_HOURS: "5"
          MC_HOST: ${{ vars.MC_HOST || 'ceyo0134.aternos.me' }}
          MC_PORT: ${{ vars.MC_PORT || '' }}
          MC_USERNAME: ${{ vars.MC_USERNAME || 'ceyobot' }}
          MC_VERSION: ${{ vars.MC_VERSION }}
          MC_PASSWORD: ${{ secrets.MC_PASSWORD }}
      - name: Wait 10-20s then start the next round
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep $((10 + RANDOM % 11))
          gh workflow run ai.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
