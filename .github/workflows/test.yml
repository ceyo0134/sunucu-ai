name: test
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Unit tests (planner, parser, tunnels in a fake world)
        run: node unit.js
      - run: pip install huggingface_hub
      - name: Download model
        run: |
          echo "::add-mask::$MODEL_REPO"
          python3 get_model.py 2>&1 | tee dl.log
          bash seal.sh seal >/dev/null && rm -rf enc
        env:
          MODEL_KEY: ${{ secrets.MODEL_KEY }}
          MODEL_REPO: ${{ vars.MODEL_REPO || 'bartowski/Qwen2.5-7B-Instruct-GGUF' }}
          MODEL_PATTERN: ${{ vars.MODEL_PATTERN || 'Q4_K_M' }}
      - name: Start llama.cpp server
        run: bash start_llm.sh 2>&1 | tee llm.log
      - name: Model self-test
        run: node selftest.js 2>&1 | tee selftest.log
      - name: Bot session
        run: node bot.js 2>&1 | tee out.log
        env:
          ONCE: "1"
          SESSION_HOURS: "0.15"
          TEST_ACTIONS: ${{ vars.TEST_ACTIONS || 'craft:wooden_pickaxe:1;mine:auto:3;tunnel:6;armor;pickup;build:tower:auto:2' }}
          MC_HOST: ${{ vars.MC_HOST || 'ceyo0134.aternos.me' }}
          MC_PORT: ${{ vars.MC_PORT || '' }}
          MC_USERNAME: ${{ vars.MC_USERNAME || 'ceyobot' }}
          MC_VERSION: ${{ vars.MC_VERSION }}
          MC_PASSWORD: ${{ secrets.MC_PASSWORD }}
          IDENTITY_TOKEN: ${{ secrets.IDENTITY_TOKEN }}
      - name: Publish logs
        if: ${{ always() }}
        run: |
          python3 notice.py dl.log download
          python3 notice.py llm.log llmlog
          python3 notice.py selftest.log selftest
          python3 notice.py out.log botlog
